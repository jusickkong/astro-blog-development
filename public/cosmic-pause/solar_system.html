<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>태양계 시뮬레이션 - 궤도 정확히 수정</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    canvas { display: block; }
    #info {
      position: absolute; top: calc(env(safe-area-inset-top, 0px) + 10px); left: 10px; right: 10px; color: #fff; font-family: Arial, sans-serif;
      background: rgba(0,0,0,0.7); padding: 12px; border-radius: 8px; z-index: 100; line-height: 1.5;
    }
    #speed-control {
      position: absolute; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.75); color: #fff; font-family: Arial, sans-serif;
      padding: 12px 20px; border-radius: 10px; z-index: 100; text-align: center;
      display: none;
    }
    #speed-control input[type=range] {
      width: 260px; accent-color: #ffcc66; cursor: pointer; vertical-align: middle;
    }
    #speed-label { font-size: 13px; margin-top: 6px; color: #ffcc66; }
    .planet-label {
      position: absolute; color: #ffffff; font-family: Arial, sans-serif; font-size: 14px;
      text-shadow: 0 0 8px #000; pointer-events: none; z-index: 50;
      transform: translate(-50%, -50%);
    }
    #info {display: none;}
    @media (max-width: 640px) {
      #speed-control input[type=range] { width: min(56vw, 220px); }
      .planet-label { font-size: 12px; }
    }
  </style>
</head>
<body data-title-key="pages.system.title">
  <div id="info" data-i18n="pages.system.info">태양계 시뮬레이션<br>
    마우스 드래그: 회전 • 휠: 줌</div>

  <div id="speed-control">
    <span data-i18n="pages.system.slower">느리게</span>
    <input type="range" id="speed-slider" min="-3" max="3" step="0.05" value="0">
    <span data-i18n="pages.system.faster">빠르게</span>
    <div id="speed-label">1 지구년 = 14초</div>
  </div>

  <script src="assets/js/i18n.js"></script>
  <script>
    window.SpaceMungI18n.applyLocale();
  </script>
  <script src="assets/js/audio-player.js"></script>
  <script>
    window.SpaceMungAudio.initPageAudio();
  </script>
  
  <script src="assets/js/three.js/r134/three.min.js"></script>
  <script src="assets/js/controls/OrbitControls.js"></script>

  <script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 2000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.12;

    // 조명: PointLight는 태양 위치에서만, ambient는 최소화
    const sunLight = new THREE.PointLight(0xffeecc, 2.0, 0);
    sunLight.decay = 0;  // 거리 감쇠 제거 → 외행성도 동일한 밝기
    sunLight.position.set(0, 0, 0);
    scene.add(sunLight);
    scene.add(new THREE.AmbientLight(0x334455, 0.6));

    const loader = new THREE.TextureLoader();

    const planetsData = [
      { nameKey: "planets.mercury", r: 0.8,  dist: 14, speed: 4.1,  tex: "assets/images/8k_mercury.jpg" },
      { nameKey: "planets.venus", r: 1.6,  dist: 20, speed: 1.6,  tex: "assets/images/4k_venus_atmosphere.jpg" },
      { nameKey: "planets.earth", r: 1.8,  dist: 28, speed: 1.0,  tex: "assets/images/Solarsystemscope_texture_8k_earth_daymap" },
      { nameKey: "planets.mars", r: 1.25, dist: 37, speed: 0.53, tex: "assets/images/Solarsystemscope_texture_8k_mars.jpg" },
      { nameKey: "planets.jupiter", r: 4.5,  dist: 60, speed: 0.084,tex: "assets/images/Solarsystemscope_texture_2k_jupiter.jpg" },
      { nameKey: "planets.saturn", r: 3.8,  dist: 85, speed: 0.034,tex: "assets/images/8k_saturn.jpg" }
    ];

    const planetMeshes = [];
    const labelElements = [];

    // 궤도선
    planetsData.forEach(p => {
      const points = [];
      for (let i = 0; i <= 128; i++) {
        const a = (i / 128) * Math.PI * 2;
        points.push(new THREE.Vector3(Math.cos(a) * p.dist, 0, Math.sin(a) * p.dist));
      }
      const orbit = new THREE.Line(
        new THREE.BufferGeometry().setFromPoints(points),
        new THREE.LineBasicMaterial({ color: 0x777777, transparent: true, opacity: 0.4 })
      );
      // rotation.x 제거: 점들이 XZ 평면에 있고 행성도 XZ 평면에서 움직이므로 회전 불필요
      scene.add(orbit);
    });

    // 행성 생성
    planetsData.forEach(p => {
      const mesh = new THREE.Mesh(
        new THREE.SphereGeometry(p.r, 64, 64),
        new THREE.MeshPhongMaterial({ map: loader.load(p.tex), shininess: 6 })
      );
      
      mesh.userData = { 
        dist: p.dist, 
        speed: p.speed,
        angle: Math.random() * Math.PI * 2 
      };
      
      scene.add(mesh);
      planetMeshes.push(mesh);

      // 라벨
      const label = document.createElement('div');
      label.className = 'planet-label';
      label.textContent = window.SpaceMungI18n.t(p.nameKey);
      document.body.appendChild(label);
      labelElements.push(label);
    });

    // 태양
    const sun = new THREE.Mesh(
      new THREE.SphereGeometry(6.8, 64, 64),
      new THREE.MeshBasicMaterial({ map: loader.load('assets/images/Solarsystemscope_texture_8k_sun.jpg') })
    );
    scene.add(sun);

    // RingGeometry UV 보정 함수 (Three.js 기본 UV는 고리 텍스처와 맞지 않음)
    function fixRingUVs(geometry, innerR, outerR) {
      const pos = geometry.attributes.position;
      const uv = new Float32Array(pos.count * 2);
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i), y = pos.getY(i);
        const r = Math.sqrt(x * x + y * y);
        uv[i * 2]     = (r - innerR) / (outerR - innerR);  // 안쪽→바깥쪽 0→1
        uv[i * 2 + 1] = 0.5;
      }
      geometry.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
    }

    // 토성 고리
    const saturnRingGeo = new THREE.RingGeometry(5.4, 10, 128);
    fixRingUVs(saturnRingGeo, 5.4, 10);
    const saturnRing = new THREE.Mesh(
      saturnRingGeo,
      new THREE.MeshBasicMaterial({
        map: loader.load('assets/images/8k_saturn_ring_alpha.png'),
        side: THREE.DoubleSide,
        transparent: true,
        alphaTest: 0.01,
      })
    );
    saturnRing.rotation.x = Math.PI / 2;
    planetMeshes[5].add(saturnRing);

    // 목성 고리 (실제로 존재하나 매우 얇고 희미함)
    const jupiterRingGeo = new THREE.RingGeometry(5.2, 6.5, 128);
    fixRingUVs(jupiterRingGeo, 5.2, 6.5);
    const jupiterRing = new THREE.Mesh(
      jupiterRingGeo,
      new THREE.MeshBasicMaterial({
        color: 0x886644,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.18,
      })
    );
    jupiterRing.rotation.x = Math.PI / 2;
    planetMeshes[4].add(jupiterRing);

    // ↓ 여기만 바꾸면 됨 (단위: 분)
    const DEFAULT_YEAR_MINUTES = 1;

    const BASE_YEAR_SEC = (2 * Math.PI) / (0.0005 * 0.9) / 1000;  // ≈ 13.96초
    const defaultSliderValue = Math.log10(BASE_YEAR_SEC / (DEFAULT_YEAR_MINUTES * 60));

    let timeScale = 0.9 * Math.pow(10, defaultSliderValue);

    function updateViewport() {
      const isMobile = window.innerWidth < 768;
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      camera.position.set(40, isMobile ? 108 : 90, isMobile ? 168 : 140);
    }

    const slider = document.getElementById('speed-slider');
    const speedLabel = document.getElementById('speed-label');
    slider.value = defaultSliderValue.toFixed(3);

    function updateLabel() {
      const yearSec = BASE_YEAR_SEC / Math.pow(10, parseFloat(slider.value));
      let text;
      if (yearSec < 60)        text = window.SpaceMungI18n.t('units.earthYearSeconds', { value: yearSec.toFixed(1) });
      else if (yearSec < 3600) text = window.SpaceMungI18n.t('units.earthYearMinutes', { value: (yearSec / 60).toFixed(1) });
      else                     text = window.SpaceMungI18n.t('units.earthYearHours', { value: (yearSec / 3600).toFixed(1) });
      speedLabel.textContent = text;
    }

    slider.addEventListener('input', () => {
      timeScale = 0.9 * Math.pow(10, parseFloat(slider.value));
      updateLabel();
    });
    window.addEventListener('spacemung:localechange', () => {
      planetsData.forEach((planet, index) => {
        labelElements[index].textContent = window.SpaceMungI18n.t(planet.nameKey);
      });
      updateLabel();
    });
    updateLabel();
    updateViewport();

    function animate() {
      requestAnimationFrame(animate);
      controls.update();

      const elapsed = Date.now() * 0.0005 * timeScale;

      planetMeshes.forEach((planet, i) => {
        const data = planet.userData;
        data.angle = elapsed * data.speed;   // ← 핵심: 매 프레임 정확히 계산

        planet.position.x = Math.cos(data.angle) * data.dist;
        planet.position.z = Math.sin(data.angle) * data.dist;
        planet.rotation.y += 0.015;   // 자전

        // 라벨 위치 업데이트
        const pos = planet.position.clone();
        pos.y += 6;
        pos.project(camera);

        const x = (pos.x * 0.5 + 0.5) * window.innerWidth;
        const y = (-pos.y * 0.5 + 0.5) * window.innerHeight;

        labelElements[i].style.left = `${x}px`;
        labelElements[i].style.top = `${y}px`;
      });

      sun.rotation.y += 0.001;
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      updateViewport();
    });
  </script>
</body>
</html>
