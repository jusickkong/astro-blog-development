<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>수성</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    canvas { display: block; }
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(82vw, 360px);
      color: #e8dfd3;
      font-family: Arial, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      text-align: center;
      pointer-events: none;
      z-index: 100;
    }
    #info {
      position: absolute;
      top: calc(env(safe-area-inset-top, 0px) + 14px);
      left: 15px;
      right: 15px;
      color: #c9c2b6;
      font-family: Arial, sans-serif;
      font-size: 13px;
      line-height: 1.5;
      pointer-events: none;
    }
    @media (max-width: 640px) {
      #info { font-size: 12px; }
    }
  </style>
</head>
<body data-title-key="pages.mercury.title">
  <div id="loading" data-i18n="pages.mercury.loading">수성 로딩 중...</div>
  <div id="info" data-i18n="pages.mercury.info">수성</div>

  <script src="assets/js/i18n.js"></script>
  <script>
    window.SpaceMungI18n.applyLocale();
  </script>
  <script src="assets/js/audio-player.js"></script>
  <script>
    window.SpaceMungAudio.initPageAudio();
  </script>

  <script src="assets/js/three.js/r134/three.min.js"></script>
  <script src="assets/js/controls/OrbitControls.js"></script>

  <script>
    const PLANET_RADIUS = 8.4;
    const CAMERA_DIRECTION = new THREE.Vector3(0.08, 0.24, 1).normalize();

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 2000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.02;
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.enablePan = false;

    const starGeo = new THREE.BufferGeometry();
    const starPos = new Float32Array(7200);
    for (let i = 0; i < starPos.length; i++) {
      starPos[i] = (Math.random() - 0.5) * 1700;
    }
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    scene.add(new THREE.Points(
      starGeo,
      new THREE.PointsMaterial({ color: 0xffffff, size: 0.42 })
    ));

    const sunLight = new THREE.DirectionalLight(0xffefcf, 2.6);
    sunLight.position.set(62, 18, 40);
    scene.add(sunLight);
    scene.add(new THREE.AmbientLight(0x2d241a, 0.34));

    const loading = document.getElementById('loading');
    const textureLoader = new THREE.TextureLoader();
    const mercuryTexture = textureLoader.load(
      'assets/images/8k_mercury.jpg',
      () => {
        loading.style.display = 'none';
      },
      undefined,
      () => {
        loading.textContent = window.SpaceMungI18n.t('pages.mercury.error');
      }
    );
    mercuryTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();

    const mercury = new THREE.Mesh(
      new THREE.SphereGeometry(PLANET_RADIUS, 180, 180),
      new THREE.MeshPhongMaterial({
        map: mercuryTexture,
        shininess: 4,
        specular: 0x1e1a16
      })
    );
    mercury.rotation.z = THREE.MathUtils.degToRad(0.03);
    scene.add(mercury);

    function fitCameraToSphere(radius, padding) {
      const vFov = THREE.MathUtils.degToRad(camera.fov);
      const hFov = 2 * Math.atan(Math.tan(vFov / 2) * camera.aspect);
      const distanceForHeight = (radius * padding) / Math.tan(vFov / 2);
      const distanceForWidth = (radius * padding) / Math.tan(hFov / 2);
      return Math.max(distanceForHeight, distanceForWidth);
    }

    function updateViewport() {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);

      const isMobile = innerWidth < 768;
      const distance = fitCameraToSphere(PLANET_RADIUS, isMobile ? 1.48 : 1.12);
      camera.position.copy(CAMERA_DIRECTION).multiplyScalar(distance);
      controls.minDistance = distance * 0.88;
      controls.maxDistance = distance * 3;
    }

    updateViewport();

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      mercury.rotation.y += 0.0011;
      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', updateViewport);
  </script>
</body>
</html>
