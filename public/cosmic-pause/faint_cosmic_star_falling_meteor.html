<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Natural Starfield</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    canvas { display: block; }
  </style>
</head>
<body data-title-key="pages.space.title">
  <script src="assets/js/i18n.js"></script>
  <script>
    window.SpaceMungI18n.applyLocale();
  </script>
  <script src="assets/js/three.js/r134/three.min.js"></script>
  <script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    function createGlowStarTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 64;
      canvas.height = 64;
      const ctx = canvas.getContext('2d');

      const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
      gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
      gradient.addColorStop(0.2, 'rgba(255, 255, 255, 0.8)');
      gradient.addColorStop(0.5, 'rgba(255, 255, 255, 0.2)');
      gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');

      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 64, 64);
      return new THREE.CanvasTexture(canvas);
    }

    function createMeteorHeadTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 96;
      canvas.height = 96;
      const ctx = canvas.getContext('2d');

      const gradient = ctx.createRadialGradient(48, 48, 4, 48, 48, 48);
      gradient.addColorStop(0, 'rgba(255,255,255,1)');
      gradient.addColorStop(0.2, 'rgba(255,244,220,0.98)');
      gradient.addColorStop(0.45, 'rgba(255,214,150,0.65)');
      gradient.addColorStop(0.75, 'rgba(255,214,150,0.18)');
      gradient.addColorStop(1, 'rgba(255,214,150,0)');

      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 96, 96);
      return new THREE.CanvasTexture(canvas);
    }

    const starGeometry = new THREE.BufferGeometry();
    const starCount = 3000;
    const starPositions = new Float32Array(starCount * 3);

    for (let i = 0; i < starCount; i++) {
      starPositions[i * 3] = (Math.random() - 0.5) * 1000;
      starPositions[i * 3 + 1] = (Math.random() - 0.5) * 1000;
      starPositions[i * 3 + 2] = (Math.random() - 0.5) * 1000;
    }

    starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));

    const starMaterial = new THREE.PointsMaterial({
      size: 2.5,
      map: createGlowStarTexture(),
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    const starMesh = new THREE.Points(starGeometry, starMaterial);
    scene.add(starMesh);
    const meteorHeadTexture = createMeteorHeadTexture();

    const meteors = [];
    const meteorClock = new THREE.Clock();
    let nextMeteorDelay = 1.8 + Math.random() * 3.2;

    function createMeteor() {
      const fromRight = Math.random() > 0.5;
      const viewHeight = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * Math.abs(camera.position.z);
      const viewWidth = viewHeight * camera.aspect;
      const margin = 0.35;

      const startX = fromRight
        ? viewWidth * 0.5 + margin + Math.random() * 0.7
        : -viewWidth * 0.5 - margin - Math.random() * 0.7;
      const startY = viewHeight * (0.2 + Math.random() * 0.32);
      const startZ = -6 + Math.random() * 3;

      const direction = fromRight
        ? new THREE.Vector3(-1, -0.62 - Math.random() * 0.18, 0)
        : new THREE.Vector3(1, -0.62 - Math.random() * 0.18, 0);
      direction.normalize();

      const trailLength = 1.8;
      const startSpeed = 0.22 + Math.random() * 0.08;
      const acceleration = 2.6 + Math.random() * 0.6;
      const color = fromRight ? 0xb8ffd9 : 0xe2f2ff;

      const head = new THREE.Sprite(new THREE.SpriteMaterial({
        map: meteorHeadTexture,
        color,
        transparent: true,
        opacity: 0.98,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      }));
      head.scale.setScalar(0.34 + Math.random() * 0.14);

      const geometry = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(0, 0, 0),
        new THREE.Vector3(0, 0, 0)
      ]);

      const material = new THREE.LineBasicMaterial({
        color,
        transparent: true,
        opacity: 0.75,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      const tail = new THREE.Line(geometry, material);
      const meteor = new THREE.Group();
      meteor.position.set(startX, startY, startZ);
      meteor.add(tail);
      meteor.add(head);
      scene.add(meteor);

      meteors.push({
        mesh: meteor,
        tail,
        head,
        direction,
        speed: startSpeed,
        acceleration,
        maxTrailLength: trailLength,
        traveled: 0,
        age: 0,
        life: 2.4 + Math.random() * 0.6
      });
    }

    function updateMeteors(delta) {
      for (let i = meteors.length - 1; i >= 0; i--) {
        const meteor = meteors[i];
        meteor.age += delta;
        const previousSpeed = meteor.speed;
        meteor.speed += meteor.acceleration * delta;
        const stepDistance = ((previousSpeed + meteor.speed) * 0.5) * delta;
        meteor.traveled += stepDistance;
        meteor.mesh.position.addScaledVector(meteor.direction, stepDistance);

        const tailLength = Math.min(meteor.maxTrailLength, meteor.traveled);
        const positions = meteor.tail.geometry.attributes.position.array;
        positions[0] = 0;
        positions[1] = 0;
        positions[2] = 0;
        positions[3] = -meteor.direction.x * tailLength;
        positions[4] = -meteor.direction.y * tailLength;
        positions[5] = -meteor.direction.z * tailLength;
        meteor.tail.geometry.attributes.position.needsUpdate = true;

        const fade = 1 - (meteor.age / meteor.life);
        meteor.tail.material.opacity = Math.max(0, fade * 0.72);
        meteor.head.material.opacity = Math.max(0, fade * 0.98);
        const sizeBoost = Math.min(1, meteor.traveled / Math.max(0.001, meteor.maxTrailLength * 0.45));
        meteor.head.scale.setScalar((0.3 + sizeBoost * 0.14) * (0.9 + fade * 0.2));

        if (meteor.age >= meteor.life) {
          scene.remove(meteor.mesh);
          meteor.tail.geometry.dispose();
          meteor.tail.material.dispose();
          meteor.head.material.dispose();
          meteors.splice(i, 1);
        }
      }
    }

    camera.position.z = 1;

    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(meteorClock.getDelta(), 0.033);

      starMesh.rotation.y += 0.0002;
      starMesh.rotation.x += 0.0001;

      updateMeteors(delta);

      nextMeteorDelay -= delta;
      if (nextMeteorDelay <= 0) {
        createMeteor();
        nextMeteorDelay = 2.2 + Math.random() * 4.2;
      }

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
