<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Three.js Star Warp Speed</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    canvas { display: block; }
  </style>
</head>
<body data-title-key="pages.warp.title">
  <script src="assets/js/i18n.js"></script>
  <script>
    window.SpaceMungI18n.applyLocale();
  </script>
  <script src="assets/js/audio-player.js"></script>
  <script>
    window.SpaceMungAudio.initPageAudio();
  </script>
  <script src="assets/js/three.js/r134/three.min.js"></script>
  <script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    // 1. 자연스러운 빛 번짐 텍스처 생성
    function createGlowTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 64; canvas.height = 64;
      const ctx = canvas.getContext('2d');
      const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
      gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
      gradient.addColorStop(0.2, 'rgba(255, 255, 255, 0.4)');
      gradient.addColorStop(0.5, 'rgba(255, 255, 255, 0.1)');
      gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 64, 64);
      return new THREE.CanvasTexture(canvas);
    }

    // 2. 별 군집 생성 및 초기화
    const starCount = 1500;
    const starGeometry = new THREE.BufferGeometry();
    const positions = new Float32Array(starCount * 3);

    for (let i = 0; i < starCount; i++) {
      positions[i * 3] = (Math.random() - 0.5) * 1000;     // X
      positions[i * 3 + 1] = (Math.random() - 0.5) * 1000; // Y
      positions[i * 3 + 2] = Math.random() * -1000;       // Z (멀리서 시작)
    }
    starGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

    const starMaterial = new THREE.PointsMaterial({
      size: 4,
      map: createGlowTexture(),
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    const starMesh = new THREE.Points(starGeometry, starMaterial);
    scene.add(starMesh);

    // 3. 애니메이션 루프: 별이 앞쪽으로 이동
    function animate() {
      requestAnimationFrame(animate);

      const pos = starGeometry.attributes.position.array;
      for (let i = 0; i < starCount; i++) {
        // Z축 값을 증가시켜 카메라 쪽으로 이동
        pos[i * 3 + 2] += 5; 

        // 카메라(Z=0)를 지나치면 다시 뒤로 배치 (무한 루프)
        if (pos[i * 3 + 2] > 0) {
          pos[i * 3 + 2] = -1000;
          pos[i * 3] = (Math.random() - 0.5) * 1000;
          pos[i * 3 + 1] = (Math.random() - 0.5) * 1000;
        }
      }
      starGeometry.attributes.position.needsUpdate = true; // 위치 변경 알림

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
