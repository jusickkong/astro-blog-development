<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>고해상도 태양 - 안정 버전</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    canvas { display: block; }
    #loading {
      position: absolute; top: 50%; left: 50%; color: #ffdd88; font-family: Arial, sans-serif;
      transform: translate(-50%, -50%); pointer-events: none; z-index: 100; font-size: 18px;
      width: min(82vw, 360px); text-align: center; line-height: 1.5;
    }
  </style>
</head>
<body data-title-key="pages.sun.title">
  <div id="loading" data-i18n="pages.sun.loading"></div>

  <script src="assets/js/i18n.js?v=2026"></script>
  <script>
    window.SpaceMungI18n.applyLocale();
  </script>
  <script src="assets/js/audio-player.js"></script>
  <script>
    window.SpaceMungAudio.initPageAudio();
  </script>
  
  <script src="assets/js/three.js/r134/three.min.js"></script>
  <script src="assets/js/controls/OrbitControls.js"></script>

  <script>
    const PLANET_RADIUS = 2.8;
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;

    // 강한 태양 빛
    const sunLight = new THREE.PointLight(0xffeebb, 5, 0);
    sunLight.position.set(0, 0, 0);
    scene.add(sunLight);
    scene.add(new THREE.AmbientLight(0x444444, 0.4));

    const textureLoader = new THREE.TextureLoader();

    const optimize = (tex) => {
      if (tex) {
        tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
        tex.minFilter = THREE.LinearMipmapLinearFilter;
      }
      return tex;
    };

    // Wikimedia 8K 태양 텍스처 (CORS 안정적)
    const sunTexture = textureLoader.load(
      'assets/images/Solarsystemscope_texture_8k_sun.jpg',
      () => {
        document.getElementById('loading').style.display = 'none';
      },
      undefined,
      (err) => {
        console.error(err);
        document.getElementById('loading').innerHTML = window.SpaceMungI18n.t('pages.sun.error');
      }
    );

    optimize(sunTexture);

    const material = new THREE.MeshBasicMaterial({
      map: sunTexture
    });

    const sun = new THREE.Mesh(new THREE.SphereGeometry(2.8, 256, 256), material);
    scene.add(sun);

    function fitCameraToSphere(radius, padding) {
      const vFov = THREE.MathUtils.degToRad(camera.fov);
      const hFov = 2 * Math.atan(Math.tan(vFov / 2) * camera.aspect);
      const distanceForHeight = (radius * padding) / Math.tan(vFov / 2);
      const distanceForWidth = (radius * padding) / Math.tan(hFov / 2);
      return Math.max(distanceForHeight, distanceForWidth);
    }

    function updateViewport() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);

      const isMobile = window.innerWidth < 768;
      const distance = fitCameraToSphere(PLANET_RADIUS, isMobile ? 1.44 : 1.18);
      camera.position.set(0, 0, distance);
      controls.minDistance = distance * 0.9;
      controls.maxDistance = distance * 3.4;
    }

    updateViewport();

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      sun.rotation.y += 0.0006;  // 태양 회전
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      updateViewport();
    });
  </script>
</body>
</html>
