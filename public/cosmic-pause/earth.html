<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>지구</title>
  <style>
    body { margin: 0; overflow: hidden; background: radial-gradient(circle at 20% 20%, #071a2a 0%, #02050b 45%, #000 100%); }
    canvas { display: block; }
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(82vw, 360px);
      color: #d8e7f8;
      font-family: Arial, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      text-align: center;
      pointer-events: none;
      z-index: 100;
    }
    #info {
      position: absolute;
      top: calc(env(safe-area-inset-top, 0px) + 14px);
      left: 15px;
      right: 15px;
      color: #c5d8ec;
      font-family: Arial, sans-serif;
      font-size: 13px;
      line-height: 1.5;
      pointer-events: none;
      text-shadow: 0 0 18px rgba(0, 0, 0, 0.45);
    }
    @media (max-width: 640px) {
      #info { font-size: 12px; }
    }
  </style>
</head>
<body data-title-key="pages.earth.title">
  <div id="loading">지구 텍스처 로딩 중...</div>
  <div id="info" data-i18n="pages.earth.info">지구 · 푸른 대기와 밤빛이 천천히 지나가는 장면</div>

  <script src="assets/js/i18n.js"></script>
  <script>
    window.SpaceMungI18n.applyLocale();
  </script>
  <script src="assets/js/audio-player.js"></script>
  <script>
    window.SpaceMungAudio.initPageAudio();
  </script>

  <script src="assets/js/three.js/r134/three.min.js"></script>
  <script src="assets/js/controls/OrbitControls.js"></script>

  <script>
    const PLANET_RADIUS = 11.5;
    const CAMERA_DIRECTION = new THREE.Vector3(-0.48, 0.18, 1).normalize();

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x02050b, 0.00055);

    const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 2000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.02;
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.rotateSpeed = 0.42;
    controls.enablePan = false;

    const textureLoader = new THREE.TextureLoader();
    const loading = document.getElementById('loading');
    const earthTexture = textureLoader.load(
      'assets/images/Solarsystemscope_texture_8k_earth_daymap.jpg',
      () => {
        loading.style.display = 'none';
      },
      undefined,
      (error) => {
        console.error('Earth texture load error', error);
        loading.textContent = '지구 텍스처를 불러오지 못했습니다. 파일 경로를 확인해 주세요.';
      }
    );
    earthTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();

    const starsGeometry = new THREE.BufferGeometry();
    const starCount = 2600;
    const starPositions = new Float32Array(starCount * 3);
    const starColors = new Float32Array(starCount * 3);

    for (let i = 0; i < starCount; i++) {
      const radius = 380 + Math.random() * 1200;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(THREE.MathUtils.randFloatSpread(2));
      const sinPhi = Math.sin(phi);
      const index = i * 3;
      const tint = 0.72 + Math.random() * 0.28;

      starPositions[index] = radius * sinPhi * Math.cos(theta);
      starPositions[index + 1] = radius * Math.cos(phi);
      starPositions[index + 2] = radius * sinPhi * Math.sin(theta);

      starColors[index] = tint;
      starColors[index + 1] = tint * (0.96 + Math.random() * 0.06);
      starColors[index + 2] = 1;
    }

    starsGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    starsGeometry.setAttribute('color', new THREE.BufferAttribute(starColors, 3));

    scene.add(new THREE.Points(
      starsGeometry,
      new THREE.PointsMaterial({
        size: 1.45,
        sizeAttenuation: true,
        vertexColors: true,
        transparent: true,
        opacity: 0.9
      })
    ));

    const sunLight = new THREE.DirectionalLight(0xf7fbff, 2.35);
    sunLight.position.set(-60, 18, 58);
    scene.add(sunLight);

    scene.add(new THREE.AmbientLight(0x16202d, 0.34));

    const earthGroup = new THREE.Group();
    earthGroup.rotation.z = THREE.MathUtils.degToRad(23.4);
    earthGroup.rotation.y = 0.3;
    scene.add(earthGroup);

    const earth = new THREE.Mesh(
      new THREE.SphereGeometry(PLANET_RADIUS, 180, 180),
      new THREE.MeshPhongMaterial({
        map: earthTexture,
        shininess: 18,
        specular: 0x2d3c4a
      })
    );
    earthGroup.add(earth);

    function createCityLightsTexture() {
      const size = 1024;
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = 'black';
      ctx.fillRect(0, 0, size, size);

      for (let i = 0; i < 1600; i++) {
        const x = Math.random() * size;
        const y = Math.random() * size;
        const w = 0.8 + Math.random() * 2.4;
        const h = 0.8 + Math.random() * 2.4;
        const alpha = 0.08 + Math.random() * 0.2;
        ctx.fillStyle = `rgba(255, ${190 + Math.random() * 40}, ${96 + Math.random() * 50}, ${alpha})`;
        ctx.fillRect(x, y, w, h);
      }

      for (let i = 0; i < 14; i++) {
        const gradient = ctx.createRadialGradient(
          Math.random() * size, Math.random() * size, 0,
          Math.random() * size, Math.random() * size, 160 + Math.random() * 120
        );
        gradient.addColorStop(0, 'rgba(255, 168, 80, 0.09)');
        gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, size, size);
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.needsUpdate = true;
      return texture;
    }

    const cityLightsTexture = createCityLightsTexture();
    const cityLights = new THREE.Mesh(
      new THREE.SphereGeometry(PLANET_RADIUS * 1.0015, 120, 120),
      new THREE.MeshBasicMaterial({
        map: cityLightsTexture,
        transparent: true,
        opacity: 0.34,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      })
    );
    cityLights.rotation.y = Math.PI * 0.92;
    earthGroup.add(cityLights);

    function fitCameraToSphere(radius, padding) {
      const vFov = THREE.MathUtils.degToRad(camera.fov);
      const hFov = 2 * Math.atan(Math.tan(vFov / 2) * camera.aspect);
      const distanceForHeight = (radius * padding) / Math.tan(vFov / 2);
      const distanceForWidth = (radius * padding) / Math.tan(hFov / 2);
      return Math.max(distanceForHeight, distanceForWidth);
    }

    function updateViewport() {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);

      const isMobile = innerWidth < 768;
      const distance = fitCameraToSphere(PLANET_RADIUS, isMobile ? 1.78 : 1.22);
      camera.position.copy(CAMERA_DIRECTION).multiplyScalar(distance);
      controls.minDistance = distance * 0.9;
      controls.maxDistance = distance * 2.9;
    }

    updateViewport();

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      earth.rotation.y += 0.00085;
      cityLights.rotation.y += 0.00088;
      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', updateViewport);
  </script>
</body>
</html>
