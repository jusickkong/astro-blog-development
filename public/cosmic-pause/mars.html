<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>화성 - 현실적인 개선 버전</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    canvas { display: block; }
    #loading {
      position: absolute; top: 50%; left: 50%; color: #ffbb88; font-family: Arial, sans-serif;
      transform: translate(-50%, -50%); pointer-events: none; z-index: 100; font-size: 18px;
      width: min(80vw, 320px); text-align: center;
    }
  </style>
</head>
<body data-title-key="pages.mars.title">
  <div id="loading" data-i18n="pages.mars.loading">화성 로딩 중...</div>

  <script src="assets/js/i18n.js"></script>
  <script>
    window.SpaceMungI18n.applyLocale();
  </script>
  <script src="assets/js/audio-player.js"></script>
  <script>
    window.SpaceMungAudio.initPageAudio();
  </script>
  
  <script src="assets/js/three.js/r134/three.min.js"></script>
  <script src="assets/js/controls/OrbitControls.js"></script>

  <script>
    const PLANET_RADIUS = 2.4;
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.12;

    // 화성에 맞는 부드럽고 따뜻한 조명
    const dirLight = new THREE.DirectionalLight(0xffddbb, 1.1);
    dirLight.position.set(15, 3, 10);   // 위에서 비추는 각도 줄임 → 극지방 번짐 방지
    scene.add(dirLight);

    scene.add(new THREE.AmbientLight(0xcc8866, 0.85));   // 색 유지하되 강도 조절

    const textureLoader = new THREE.TextureLoader();

    const optimize = (tex) => {
      tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
      tex.minFilter = THREE.LinearMipmapLinearFilter;
      return tex;
    };

    // 8K 컬러
    const marsTexture = textureLoader.load(
      'assets/images/Solarsystemscope_texture_8k_mars.jpg',
      () => document.getElementById('loading').style.display = 'none'
    );

    // Normal Map (입체감)
    const normalMap = optimize(textureLoader.load(
      'assets/images/2k_mars_normal.jpg'
    ));

    const material = new THREE.MeshPhongMaterial({
      map: marsTexture,
      // normalMap 제거: 극점 pinching(꼬깔) 현상의 원인
      shininess: 2,
      specular: 0x111111,
      emissive: 0x1a0a00,
    });

    const mars = new THREE.Mesh(new THREE.SphereGeometry(2.4, 256, 256), material);
    mars.rotation.z = 25.2 * (Math.PI / 180);  // 실제 화성 자전축 기울기 25.2° → 극점이 옆으로
    scene.add(mars);

    function fitCameraToSphere(radius, padding) {
      const vFov = THREE.MathUtils.degToRad(camera.fov);
      const hFov = 2 * Math.atan(Math.tan(vFov / 2) * camera.aspect);
      const distanceForHeight = (radius * padding) / Math.tan(vFov / 2);
      const distanceForWidth = (radius * padding) / Math.tan(hFov / 2);
      return Math.max(distanceForHeight, distanceForWidth);
    }

    function updateViewport() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);

      const isMobile = window.innerWidth < 768;
      const distance = fitCameraToSphere(PLANET_RADIUS, isMobile ? 1.44 : 1.18);
      camera.position.set(0, 0, distance);
      controls.minDistance = distance * 0.9;
      controls.maxDistance = distance * 3.2;
    }

    updateViewport();

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      mars.rotation.y += 0.0003;
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      updateViewport();
    });
  </script>
</body>
</html>
