<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>토성 멍</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    canvas { display: block; }
    #info {
      position: absolute; top: calc(env(safe-area-inset-top, 0px) + 14px); left: 15px; right: 15px; color: #aaa;
      font-family: Arial, sans-serif; font-size: 13px;
      pointer-events: none;
      line-height: 1.5;
    }
    @media (max-width: 640px) {
      #info { font-size: 12px; }
    }
  </style>
</head>
<body data-title-key="pages.saturn.title">
  <div id="info" data-i18n="pages.saturn.info">토성</div>

  <script src="assets/js/i18n.js"></script>
  <script>
    window.SpaceMungI18n.applyLocale();
  </script>
  <script src="assets/js/audio-player.js"></script>
  <script>
    window.SpaceMungAudio.initPageAudio();
  </script>

  <script src="assets/js/three.js/r134/three.min.js"></script>
  <script src="assets/js/controls/OrbitControls.js"></script>

  <script>
    const PLANET_RADIUS = 8;
    const CAMERA_DIRECTION = new THREE.Vector3(0, 0.40, 1).normalize();
    const CAMERA_TARGET = new THREE.Vector3(2, -2.4, 0);
    // ── 기본 세팅 ──────────────────────────────
    const scene    = new THREE.Scene();
    const camera   = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 2000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.target.copy(CAMERA_TARGET);

    // ── 별 배경 ────────────────────────────────
    const starGeo = new THREE.BufferGeometry();
    const starPos = new Float32Array(6000);
    for (let i = 0; i < 6000; i++) {
      starPos[i] = (Math.random() - 0.5) * 1600;
    }
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.4 })));

    // ── 조명 ──────────────────────────────────
    const sunLight = new THREE.DirectionalLight(0xfff5e0, 2.2);
    sunLight.position.set(60, 30, 50);
    scene.add(sunLight);
    scene.add(new THREE.AmbientLight(0x223344, 0.7));

    // ── 토성 본체 텍스처 (캔버스로 직접 생성) ──────────
    function createSaturnTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024; canvas.height = 512;
      const ctx = canvas.getContext('2d');

      // 기본 배경: 크림색
      ctx.fillStyle = '#d4b483';
      ctx.fillRect(0, 0, 1024, 512);

      // 위도별 밴드 (토성의 특징적인 가로 줄무늬)
      const bands = [
        { y: 0.00, h: 0.06, color: 'rgba(160,120,75,0.55)' },
        { y: 0.06, h: 0.04, color: 'rgba(200,170,120,0.30)' },
        { y: 0.10, h: 0.08, color: 'rgba(145,108,65,0.50)' },
        { y: 0.18, h: 0.05, color: 'rgba(210,185,135,0.25)' },
        { y: 0.23, h: 0.10, color: 'rgba(190,155,100,0.40)' },
        { y: 0.33, h: 0.04, color: 'rgba(225,200,150,0.20)' },
        { y: 0.37, h: 0.12, color: 'rgba(170,135,85,0.35)' },  // 적도 근처 짙은 띠
        { y: 0.49, h: 0.02, color: 'rgba(240,215,165,0.30)' },
        { y: 0.51, h: 0.12, color: 'rgba(170,135,85,0.35)' },
        { y: 0.63, h: 0.04, color: 'rgba(225,200,150,0.20)' },
        { y: 0.67, h: 0.10, color: 'rgba(190,155,100,0.40)' },
        { y: 0.77, h: 0.05, color: 'rgba(210,185,135,0.25)' },
        { y: 0.82, h: 0.08, color: 'rgba(145,108,65,0.50)' },
        { y: 0.90, h: 0.04, color: 'rgba(200,170,120,0.30)' },
        { y: 0.94, h: 0.06, color: 'rgba(160,120,75,0.55)' },
      ];

      bands.forEach(b => {
        const grad = ctx.createLinearGradient(0, b.y * 512, 0, (b.y + b.h) * 512);
        grad.addColorStop(0,   'rgba(0,0,0,0)');
        grad.addColorStop(0.5, b.color);
        grad.addColorStop(1,   'rgba(0,0,0,0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, b.y * 512, 1024, b.h * 512);
      });

      // 극지방 살짝 어둡게
      ['top','bottom'].forEach(side => {
        const g = ctx.createLinearGradient(0, side === 'top' ? 0 : 512, 0, side === 'top' ? 80 : 432);
        g.addColorStop(0, 'rgba(80,55,30,0.45)');
        g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, 1024, 512);
      });

      return new THREE.CanvasTexture(canvas);
    }

    // ── 토성 본체 ──────────────────────────────
    const saturnGroup = new THREE.Group();
    saturnGroup.rotation.z = 26.7 * Math.PI / 180;  // 실제 자전축 기울기
    scene.add(saturnGroup);

    const saturn = new THREE.Mesh(
      new THREE.SphereGeometry(8, 128, 128),
      new THREE.MeshPhongMaterial({
        map: new THREE.TextureLoader().load('assets/images/8k_saturn.jpg'),
        shininess: 8,
        specular: 0x111111,
      })
    );
    saturnGroup.add(saturn);

    // ── 고리 텍스처 (1D 방사형, 처음에 잘 나왔던 방식) ───────
    function createRingTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024; canvas.height = 4;
      const ctx = canvas.getContext('2d');
      const grad = ctx.createLinearGradient(0, 0, 1024, 0);
      grad.addColorStop(0.00, 'rgba(0,0,0,0)');
      grad.addColorStop(0.06, 'rgba(185,165,135,0.22)');
      grad.addColorStop(0.18, 'rgba(185,165,135,0.38)');
      grad.addColorStop(0.22, 'rgba(220,200,165,0.88)');
      grad.addColorStop(0.32, 'rgba(235,215,178,1.00)');
      grad.addColorStop(0.44, 'rgba(215,195,160,0.92)');
      grad.addColorStop(0.50, 'rgba(0,0,0,0)');       // 카시니 간극
      grad.addColorStop(0.55, 'rgba(0,0,0,0)');
      grad.addColorStop(0.60, 'rgba(205,185,150,0.82)');
      grad.addColorStop(0.74, 'rgba(190,170,135,0.62)');
      grad.addColorStop(0.80, 'rgba(185,165,130,0.28)');  // 엔케 간극 근처
      grad.addColorStop(0.90, 'rgba(180,160,125,0.10)');
      grad.addColorStop(1.00, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 1024, 4);
      return new THREE.CanvasTexture(canvas);
    }

    // ── UV 보정: U=반경, V=0.5(고정) ─────────────────────
    const RING_INNER = 9.1, RING_OUTER = 17.2;

    function fixRingUVs(geometry) {
      const pos = geometry.attributes.position;
      const uv  = new Float32Array(pos.count * 2);
      for (let i = 0; i < pos.count; i++) {
        const r = Math.sqrt(pos.getX(i) ** 2 + pos.getY(i) ** 2);
        uv[i * 2]     = (r - RING_INNER) / (RING_OUTER - RING_INNER);
        uv[i * 2 + 1] = 0.5;
      }
      geometry.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
    }

    // ── 단일 링 메시 ──────────────────────────────────
    const ringGeo = new THREE.RingGeometry(RING_INNER, RING_OUTER, 256);
    fixRingUVs(ringGeo);
    const ringMesh = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({
      map: createRingTexture(),
      side: THREE.DoubleSide,
      transparent: true,
      depthWrite: false,
    }));
    ringMesh.rotation.x = Math.PI / 2;
    saturnGroup.add(ringMesh);

    // ── 공전 파티클 (역동성) ─────────────────────────────
    // 케플러 법칙: 각속도 ∝ 1/r^(3/2)
    const PARTICLE_COUNT = 3000;
    const pRadii  = new Float32Array(PARTICLE_COUNT);
    const pAngles = new Float32Array(PARTICLE_COUNT);
    const pSpeeds = new Float32Array(PARTICLE_COUNT);

    for (let i = 0; i < PARTICLE_COUNT; i++) {
      // 카시니 간극(반경 비율 0.5~0.55) 제외하고 배치
      let t;
      do { t = Math.random(); } while (t > 0.48 && t < 0.57);
      pRadii[i]  = RING_INNER + t * (RING_OUTER - RING_INNER);
      pAngles[i] = Math.random() * Math.PI * 2;
      pSpeeds[i] = 0.0022 * Math.pow(RING_INNER / pRadii[i], 1.5);
    }

    const pPositions = new Float32Array(PARTICLE_COUNT * 3);
    const pGeo = new THREE.BufferGeometry();
    pGeo.setAttribute('position', new THREE.BufferAttribute(pPositions, 3));
    const particles = new THREE.Points(pGeo, new THREE.PointsMaterial({
      color: 0xddccaa, size: 0.06, transparent: true, opacity: 0.55,
    }));
    particles.rotation.x = Math.PI / 2;
    saturnGroup.add(particles);

    function fitCameraToSphere(radius, padding) {
      const vFov = THREE.MathUtils.degToRad(camera.fov);
      const hFov = 2 * Math.atan(Math.tan(vFov / 2) * camera.aspect);
      const distanceForHeight = (radius * padding) / Math.tan(vFov / 2);
      const distanceForWidth = (radius * padding) / Math.tan(hFov / 2);
      return Math.max(distanceForHeight, distanceForWidth);
    }

    function updateViewport() {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);

      const isMobile = innerWidth < 768;
      const distance = fitCameraToSphere(PLANET_RADIUS, isMobile ? 2.28 : 1.68);
      camera.position.copy(CAMERA_DIRECTION).multiplyScalar(distance);
      controls.target.copy(CAMERA_TARGET);
      controls.minDistance = distance * 0.86;
      controls.maxDistance = distance * 3.4;
      controls.update();
    }

    updateViewport();

    // ── 애니메이션 ─────────────────────────────
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      saturn.rotation.y += 0.0018;

      // 파티클 공전
      const pos = pGeo.attributes.position;
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        pAngles[i] += pSpeeds[i];
        pos.setXY(i, Math.cos(pAngles[i]) * pRadii[i], Math.sin(pAngles[i]) * pRadii[i]);
      }
      pos.needsUpdate = true;

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      updateViewport();
    });
  </script>
</body>
</html>
