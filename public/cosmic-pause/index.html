<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SpaceMung</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      padding: 24px 16px 96px;
      color: #f2f7ff;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top, rgba(84, 132, 255, 0.18), transparent 34%),
        radial-gradient(circle at 18% 12%, rgba(255, 255, 255, 0.08), transparent 22%),
        linear-gradient(180deg, #030610 0%, #07111f 48%, #02050b 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.16;
      background-image:
        radial-gradient(circle, rgba(255,255,255,0.76) 0 1px, transparent 1.5px),
        radial-gradient(circle, rgba(255,255,255,0.42) 0 1px, transparent 1.5px);
      background-size: 140px 140px, 220px 220px;
      background-position: 0 0, 70px 50px;
    }

    .app-shell {
      width: min(1120px, 100%);
      margin: 0 auto;
      display: grid;
      gap: 18px;
    }

    .hero {
      position: relative;
      overflow: hidden;
      padding: 26px 20px 22px;
      border-radius: 28px;
      border: 1px solid rgba(157, 189, 255, 0.12);
      background: linear-gradient(180deg, rgba(11, 20, 38, 0.82), rgba(5, 11, 21, 0.92));
      box-shadow: 0 24px 90px rgba(0, 0, 0, 0.32);
    }

    .hero::after {
      content: "";
      position: absolute;
      width: 240px;
      height: 240px;
      right: -80px;
      top: -100px;
      background: radial-gradient(circle, rgba(132, 170, 255, 0.4), rgba(132, 170, 255, 0));
      filter: blur(4px);
    }

    .eyebrow {
      display: inline-flex;
      margin-bottom: 14px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid rgba(140, 175, 255, 0.16);
      background: rgba(140, 175, 255, 0.1);
      color: #bfd3ff;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin-bottom: 10px;
      color: #aad4ff;
      font-size: clamp(2.2rem, 8vw, 4.8rem);
      line-height: 0.96;
      letter-spacing: 0.08em;
    }

    p.sub {
      margin-bottom: 14px;
      color: #c6d7fb;
      font-size: clamp(1rem, 3.8vw, 1.1rem);
    }

    .lead {
      max-width: 42rem;
      color: #8ea5d8;
      font-size: 0.95rem;
      line-height: 1.7;
    }

    .cast-note {
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.04);
    }

    .cast-note strong {
      display: block;
      margin-bottom: 4px;
      color: #eef4ff;
      font-size: 0.92rem;
    }

    .cast-note span {
      color: #9db2dc;
      font-size: 0.88rem;
      line-height: 1.6;
    }

    .list {
      display: grid;
      gap: 12px;
    }

    a.item {
      display: flex;
      align-items: center;
      gap: 16px;
      min-height: 84px;
      padding: 18px;
      border-radius: 22px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.04);
      color: #ddeeff;
      text-decoration: none;
      transition: background 0.2s, border-color 0.2s, transform 0.15s, box-shadow 0.2s;
      backdrop-filter: blur(8px);
    }

    a.item:hover {
      transform: translateY(-2px);
      border-color: rgba(100,160,255,0.4);
      background: rgba(100,160,255,0.12);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.22);
    }

    .icon {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.06);
      font-size: 1.7rem;
    }

    .label { flex: 1; }

    .label .title {
      color: #f2f7ff;
      font-size: 1rem;
      font-weight: bold;
    }

    .label .desc {
      margin-top: 4px;
      color: #88a0cf;
      font-size: 0.82rem;
      line-height: 1.45;
    }

    .arrow {
      flex-shrink: 0;
      color: #7690c9;
      font-size: 1.15rem;
    }

    .item.ad-slot {
      align-items: flex-start;
      min-height: 120px;
      border-style: dashed;
      border-color: rgba(120, 150, 210, 0.24);
      background:
        linear-gradient(180deg, rgba(17, 27, 45, 0.72), rgba(8, 14, 26, 0.84));
    }

    .item.ad-slot:hover {
      transform: none;
      border-color: rgba(120, 150, 210, 0.32);
      background:
        linear-gradient(180deg, rgba(17, 27, 45, 0.78), rgba(8, 14, 26, 0.9));
      box-shadow: none;
    }

    .item.ad-slot .icon {
      background: rgba(255, 196, 110, 0.1);
      color: #ffd98f;
    }

    .item.ad-slot .title {
      color: #fff2cf;
    }

    .item.ad-slot .desc {
      color: #aab7d4;
    }

    @media (min-width: 720px) {
      body {
        padding: 32px 24px 96px;
      }

      .hero {
        padding: 34px 28px 26px;
      }

      .list {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (min-width: 1080px) {
      .app-shell {
        grid-template-columns: 1.05fr 1fr;
        align-items: start;
      }

      .hero {
        min-height: calc(100vh - 64px);
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .list {
        min-height: calc(100vh - 64px);
        align-content: start;
      }
    }

    @media (max-width: 420px) {
      body {
        padding-inline: 12px;
      }

      .hero {
        padding: 92px 16px 20px;
        border-radius: 24px;
      }

      a.item {
        min-height: 78px;
        padding: 16px;
      }
    }

    @media (max-width: 640px) {
      .hero {
        padding-top: 92px;
        padding-right: min(248px, 44vw);
      }
    }

    @media (max-width: 520px) {
      .hero {
        padding-right: 18px;
      }
    }
  </style>
</head>
<body data-title-key="home.title">
  <div class="app-shell">
    <section class="hero">
      <h1 data-i18n="home.title"></h1>
      <p class="sub" data-i18n="home.subtitle"></p>
      <p class="lead" data-i18n="home.lead"></p>
      <div class="cast-note">
        <strong data-i18n="home.cast.title"></strong>
        <span data-i18n="home.cast.desc"></span>
      </div>
    </section>

    <div class="list" id="scene-list"></div>
  </div>
  <script src="assets/js/i18n.js"></script>
  <script>
    const listItems = [
      { type: 'scene', href: 'moon.html', icon: '🌕', titleKey: 'home.moon.title', descKey: 'home.moon.desc' },
      { type: 'scene', href: 'mercury.html', icon: '☿', titleKey: 'home.mercury.title', descKey: 'home.mercury.desc' },
      { type: 'scene', href: 'earth.html', icon: '🌍', titleKey: 'home.earth.title', descKey: 'home.earth.desc' },
      { type: 'scene', href: 'solar.html', icon: '☀️', titleKey: 'home.sun.title', descKey: 'home.sun.desc' },
      /*{
        type: 'ad',
        icon: 'AD',
        title: '광고 슬롯',
        desc: '여기에 배너, 스폰서 카드, 자체 프로모션을 원하는 순서에 끼워 넣을 수 있습니다.'
      },*/
      { type: 'scene', href: 'mars.html', icon: '🔴', titleKey: 'home.mars.title', descKey: 'home.mars.desc' },
      { type: 'scene', href: 'solar_system.html', icon: '🪐', titleKey: 'home.system.title', descKey: 'home.system.desc' },
      { type: 'scene', href: 'stars_pouring_out_forward.html', icon: '✨', titleKey: 'home.warp.title', descKey: 'home.warp.desc' },
      { type: 'scene', href: 'faint_cosmic_star_falling_meteor.html', icon: '🌌', titleKey: 'home.space.title', descKey: 'home.space.desc' },
      { type: 'scene', href: 'milky_way.html', icon: '🌠', titleKey: 'home.milkyway.title', descKey: 'home.milkyway.desc' },
      { type: 'scene', href: 'saturn.html', icon: '🪐', titleKey: 'home.saturn.title', descKey: 'home.saturn.desc' },
      { type: 'scene', href: 'jupiter.html', icon: '♃', titleKey: 'home.jupiter.title', descKey: 'home.jupiter.desc' },
      { type: 'scene', href: 'uranus.html', icon: '⛢', titleKey: 'home.uranus.title', descKey: 'home.uranus.desc' },
      { type: 'scene', href: 'neptune.html', icon: '♆', titleKey: 'home.neptune.title', descKey: 'home.neptune.desc' },
      { type: 'scene', href: 'venus.html', icon: '♀', titleKey: 'home.venus.title', descKey: 'home.venus.desc' }
    ];

    function renderSceneList() {
      const container = document.getElementById('scene-list');
      container.innerHTML = '';

      listItems.forEach((item) => {
        if (item.type === 'ad') {
          const slot = document.createElement('div');
          slot.className = 'item ad-slot';
          slot.innerHTML = `
            <div class="icon">${item.icon}</div>
            <div class="label">
              <div class="title">${item.title}</div>
              <div class="desc">${item.desc}</div>
            </div>
          `;
          container.appendChild(slot);
          return;
        }

        const link = document.createElement('a');
        link.className = 'item';
        link.href = item.href;
        link.innerHTML = `
          <div class="icon">${item.icon}</div>
          <div class="label">
            <div class="title" data-i18n="${item.titleKey}">${window.SpaceMungI18n.t(item.titleKey)}</div>
            <div class="desc" data-i18n="${item.descKey}">${window.SpaceMungI18n.t(item.descKey)}</div>
          </div>
          <div class="arrow">›</div>
        `;
        container.appendChild(link);
      });
    }

    renderSceneList();
    window.SpaceMungI18n.installSettingsPanel();
    window.SpaceMungI18n.applyLocale();
  </script>
</body>
</html>
