<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>선명한 달 - 안정 버전 2</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    canvas { display: block; }
    #loading {
      position: absolute; top: 50%; left: 50%; color: #fff; font-family: Arial, sans-serif;
      transform: translate(-50%, -50%); pointer-events: none; z-index: 100;
      width: min(80vw, 320px); text-align: center; line-height: 1.5;
    }
  </style>
</head>
<body data-title-key="pages.moon.title">
  <div id="loading" data-i18n="pages.moon.loading">달 로딩 중...</div>

  <script src="assets/js/i18n.js"></script>
  <script>
    window.SpaceMungI18n.applyLocale();
  </script>
  <script src="assets/js/audio-player.js"></script>
  <script>
    window.SpaceMungAudio.initPageAudio();
  </script>
  
  <script src="assets/js/three.js/r134/three.min.js"></script>
  <script src="assets/js/controls/OrbitControls.js"></script>

  <script>
    const PLANET_RADIUS = 2;
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.98;
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.1;

    // 조명
    const dirLight = new THREE.DirectionalLight(0xf6f8ff, 1.15);
    dirLight.position.set(8, 5, 10);
    scene.add(dirLight);
    scene.add(new THREE.AmbientLight(0x2a3140, 0.18));

    const textureLoader = new THREE.TextureLoader();

    const optimize = (tex) => {
      if (tex) {
        tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
        tex.minFilter = THREE.LinearMipmapLinearFilter;
      }
      return tex;
    };

    // 안전한 Wikimedia 8K 링크 (CORS 문제 거의 없음)
    const moonTexture = textureLoader.load(
      'assets/images/Solarsystemscope_texture_8k_moon.jpg',
      () => { document.getElementById('loading').style.display = 'none'; },
      undefined,
      (err) => { 
        console.error('Texture load error', err);
        document.getElementById('loading').innerHTML = window.SpaceMungI18n.t('pages.moon.error');
      }
    );

    optimize(moonTexture);

    const material = new THREE.MeshPhongMaterial({
      map: moonTexture,
      color: 0xd9dde6,
      shininess: 1,
      specular: 0x111111,
      bumpScale: 0.008,
    });

    const moon = new THREE.Mesh(new THREE.SphereGeometry(2, 256, 256), material);
    scene.add(moon);

    function fitCameraToSphere(radius, padding) {
      const vFov = THREE.MathUtils.degToRad(camera.fov);
      const hFov = 2 * Math.atan(Math.tan(vFov / 2) * camera.aspect);
      const distanceForHeight = (radius * padding) / Math.tan(vFov / 2);
      const distanceForWidth = (radius * padding) / Math.tan(hFov / 2);
      return Math.max(distanceForHeight, distanceForWidth);
    }

    function updateViewport() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);

      const isMobile = window.innerWidth < 768;
      const distance = fitCameraToSphere(PLANET_RADIUS, isMobile ? 1.42 : 1.16);
      camera.position.set(0, 0, distance);
      controls.minDistance = distance * 0.92;
      controls.maxDistance = distance * 3.2;
    }

    updateViewport();

    window.addEventListener('resize', () => {
      updateViewport();
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      moon.rotation.y += 0.00025;
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
